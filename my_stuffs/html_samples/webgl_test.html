<!doctype html>
<html lang="en">
    <head>
        <title>WebGL Demo</title>
        <meta charset="utf-8">
    </head>

    <body>
        <canvas id="glcanvas" width="1" height="1"></canvas>
    </body>

    <script id="vertex" type="x-shader/x-vertex">
        #extension GL_ANGLE_multi_draw : require
        attribute vec4 aVertexColor;
        varying highp vec4 vColor;
        void main() {
            gl_Position = vec4(0,0,0,0);
            gl_PointSize = 1.0;
            vColor = aVertexColor;
        }
    </script>

    <script id="fragment" type="x-shader/x-fragment">
        varying highp vec4 vColor;
        void main() {
            gl_FragColor = vColor;
        }
    </script>

    <script>
        function createShader(gl, type, source) {
            var shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            var success = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
            if (success) {
                return shader;
            }

            console.log(gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
        }

        function createProgram(gl, vertexShader, fragmentShader) {
            var program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            var success = gl.getProgramParameter(program, gl.LINK_STATUS);
            if (success) {
            return program;
            }

            console.log(gl.getProgramInfoLog(program));
            gl.deleteProgram(program);
        }

        const canvas = document.querySelector('#glcanvas');
        const gl = canvas.getContext('webgl2', {preserveDrawingBuffer: true});
        const ext = gl.getExtension('WEBGL_multi_draw');

        function drawScene(pColors) {
            colors = new Uint8Array(pColors);

            var vertexShaderSource = document.querySelector("#vertex").text;
            var fragmentShaderSource = document.querySelector("#fragment").text;
            var vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
            var fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
            var program = createProgram(gl, vertexShader, fragmentShader);

            var vertexColor = gl.getAttribLocation(program, "aVertexColor");
            var colorBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, 8, gl.STATIC_DRAW);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, colors);

            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.viewport(0, 0, 1, 1);
            gl.useProgram(program);
            gl.enableVertexAttribArray(vertexColor);
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.vertexAttribPointer(vertexColor, 4, gl.UNSIGNED_BYTE, true, 0, 0);

            var pixels = new Uint8Array(4);

            let firsts = new Array(0, 0, 0, 0, 1);
            let counts = new Int32Array([1, 1, 1, 1, 1]);
            ext.multiDrawArraysWEBGL(gl.POINTS, firsts, 0, counts, 0, firsts.length);

            gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            console.log(pixels);
        }

        drawScene([0, 0, 0, 0, 72, 8, 27, 0]);

    </script>
</html>
